<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulateur ATV320 - Oscilloscope & Son MLI</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        .plateforme {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        /* VARIATEUR ATV320 */
        .variateur {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 300px;
            border: 2px solid #444;
        }
        .ecran {
            background-color: #1a0000;
            color: #ff2a2a;
            font-family: 'Courier New', Courier, monospace;
            font-size: 38px;
            font-weight: bold;
            text-align: right;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
            letter-spacing: 2px;
            height: 45px;
            line-height: 45px;
        }
        .clignotement { animation: clignoterLed 0.25s infinite alternate; }
        @keyframes clignoterLed { from { opacity: 1; } to { opacity: 0.1; } }
        
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button.btn-atv {
            background-color: #444;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px #1a1a1a;
            touch-action: manipulation;
        }
        button.btn-atv:active { box-shadow: 0 0px #1a1a1a; transform: translateY(4px); }
        .btn-esc { background-color: #a71d2a !important; }
        .btn-ent { background-color: #1e7e34 !important; }
        .molette { grid-column: span 2; display: flex; justify-content: space-between; }
        .molette button { width: 48%; }

        /* BORNIER DE COMMANDE */
        .bornier {
            margin-top: 15px;
            background: #202020;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        .bornier-title { font-size: 13px; color: #aaa; margin-bottom: 8px; text-align: center; }
        .interrupteurs { display: flex; justify-content: space-around; }
        .switch-container { text-align: center; font-size: 12px; }
        .switch-btn {
            background: #555;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
            font-weight: bold;
        }
        .switch-btn.active { background: #007bff; }

        /* MOTEUR VIRTUEL & OSCILLOSCOPE */
        .panneau-moteur {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .moteur-svg { width: 110px; height: 110px; }
        .rotor { transform-origin: center; }

        .cadre-oscillo {
            background: #111;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .titre-oscillo { font-size: 11px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; }
        canvas { background: #050505; border: 1px solid #222; border-radius: 4px; width: 100%; height: 110px; }

        .btn-audio {
            background: #6f42c1;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-audio.actif { background: #28a745; }

        /* MODULE TP & RAPPORTS */
        .panneau-droite { display: flex; flex-direction: column; gap: 15px; width: 360px; }
        .carte { background: #2b2b2b; padding: 15px; border-radius: 12px; border: 2px solid #444; }
        .carte h3 { margin-top: 0; font-size: 16px; color: #00ffcc; border-bottom: 1px solid #444; padding-bottom: 8px; }
        
        .champs-etudiant { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .input-etudiant { background: #111; border: 1px solid #555; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; font-size: 13px; }
        .select-tp { width: 100%; background: #111; color: #00ffcc; border: 1px solid #555; padding: 8px; border-radius: 4px; font-weight: bold; margin-bottom: 10px; }
        .consigne-box { background: #1a1a1a; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
        
        .groupe-boutons-eval { display: flex; gap: 10px; }
        .btn-eval { background: #28a745; color: white; border: none; padding: 10px; flex: 1; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-export { background: #007bff; color: white; border: none; padding: 10px; flex: 1; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
        .resultat-eval { margin-top: 10px; font-size: 13px; padding: 8px; border-radius: 4px; display: none; }

        .grid-defauts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-defaut { background: #dc3545; color: white; border: none; padding: 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-reset { background: #17a2b8; color: white; border: none; padding: 8px; font-size: 12px; border-radius: 4px; cursor: pointer; grid-column: span 2; }
    </style>
</head>
<body>

<h2 style="margin-bottom: 20px; text-align: center;">Simulateur Pédagogique Altivar ATV320</h2>

<div class="plateforme">

    <!-- VARIATEUR ATV320 -->
    <div class="variateur">
        <div class="ecran" id="affichage">rdY</div>
        
        <div class="controles">
            <button class="btn-atv btn-esc" onclick="actionEsc()">ESC</button>
            <button class="btn-atv btn-ent" onclick="actionEnt()">ENT</button>
            <div class="molette">
                <button class="btn-atv" id="btn-haut">▲</button>
                <button class="btn-atv" id="btn-bas">▼</button>
            </div>
        </div>

        <div class="bornier">
            <div class="bornier-title">Bornier de Commande Virtuel</div>
            <div class="interrupteurs">
                <div class="switch-container">
                    <div>DI1 (FWD)</div>
                    <button class="switch-btn" id="sw-di1" onclick="basculerDI(1)">OFF</button>
                </div>
                <div class="switch-container">
                    <div>DI2 (REV)</div>
                    <button class="switch-btn" id="sw-di2" onclick="basculerDI(2)">OFF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MOTEUR & OSCILLOSCOPE & AUDIO -->
    <div class="panneau-moteur">
        <h3 style="margin: 0; font-size: 15px;">Moteur & Oscilloscope</h3>
        
        <svg class="moteur-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#3a3a3a" stroke="#666" stroke-width="4"/>
            <circle cx="50" cy="50" r="32" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
            <g id="rotor" class="rotor">
                <circle cx="50" cy="50" r="22" fill="#007bff"/>
                <line x1="50" y1="28" x2="50" y2="72" stroke="#fff" stroke-width="3"/>
                <line x1="28" y1="50" x2="72" y2="50" stroke="#fff" stroke-width="3"/>
            </g>
        </svg>

        <!-- Module Son MLI -->
        <button class="btn-audio" id="btn-audio" onclick="basculerAudio()">🔊 Activer Son MLI Moteur</button>

        <!-- Graphique Temps Réel -->
        <div class="cadre-oscillo">
            <div class="titre-oscillo">
                <span style="color: #00ffcc;">― Fréquence (Hz)</span>
                <span style="color: #ffcc00;">― Courant (A)</span>
            </div>
            <canvas id="oscilloscope" width="280" height="110"></canvas>
        </div>
    </div>

    <!-- MODULE TP & DEFFAUTS -->
    <div class="panneau-droite">
        <div class="carte">
            <h3>Évaluation & Rapport TP</h3>
            <div class="champs-etudiant">
                <input type="text" id="nom-etudiant" class="input-etudiant" placeholder="Nom">
                <input type="text" id="prenom-etudiant" class="input-etudiant" placeholder="Prénom">
            </div>

            <select id="select-tp" class="select-tp" onchange="changerTP()">
                <option value="tp1">TP 1 : Plaque Signalétique Moteur</option>
                <option value="tp2">TP 2 : Configuration des Rampes</option>
                <option value="tp3">TP 3 : Limitation de Vitesse (LSP/HSP)</option>
            </select>

            <div class="consigne-box" id="consigne-tp"></div>

            <div class="groupe-boutons-eval">
                <button class="btn-eval" onclick="evaluerTP()">Valider</button>
                <button class="btn-export" id="btn-export" onclick="exporterRapportWord()">Exporter (.doc)</button>
            </div>

            <div id="resultat-tp" class="resultat-eval"></div>
        </div>

        <div class="carte">
            <h3>Injecteur de Pannes</h3>
            <div class="grid-defauts">
                <button class="btn-defaut" onclick="declencherDefaut('OHF')">OHF (Surchauffe)</button>
                <button class="btn-defaut" onclick="declencherDefaut('OLF')">OLF (Surcharge)</button>
                <button class="btn-defaut" onclick="declencherDefaut('OSF')">OSF (Surtension)</button>
                <button class="btn-defaut" onclick="declencherDefaut('InF')">InF (Défaut Interne)</button>
                <button class="btn-reset" onclick="acquitterDefaut()">Acquitter / Reset</button>
            </div>
        </div>
    </div>

</div>

<script>
    // 1. Arborescence des menus ATV320
    const menuATV320 = {
        id: "ROOT", type: "menu", enfants: [
            { id: "rEF-", type: "menu", enfants: [] },
            { id: "COnF", type: "menu", enfants: [
                { id: "FULL", type: "menu", enfants: [
                    { id: "drC-", type: "menu", enfants: [
                        { id: "bFr", type: "param", valeur: 50.0, pas: 10.0, paramKey: "bFr" },
                        { id: "UnS", type: "param", valeur: 400.0, pas: 10.0, paramKey: "UnS" },
                        { id: "nCr", type: "param", valeur: 4.2, pas: 0.1, paramKey: "nCr" },
                        { id: "FrS", type: "param", valeur: 50.0, pas: 1.0, paramKey: "FrS" }
                    ]},
                    { id: "FUn-", type: "menu", enfants: [
                        { id: "ACC", type: "param", valeur: 3.0, pas: 0.1, paramKey: "ACC" },
                        { id: "dEC", type: "param", valeur: 3.0, pas: 0.1, paramKey: "dEC" },
                        { id: "LSP", type: "param", valeur: 0.0, pas: 0.1, paramKey: "LSP" },
                        { id: "HSP", type: "param", valeur: 50.0, pas: 0.1, paramKey: "HSP" }
                    ]}
                ]}
            ]}
        ]
    };

    const banquesTP = {
        tp1: { titre: "TP 1 : Plaque Signalétique", consignes: "1. UnS : <strong>380 V</strong><br>2. nCr : <strong>5.5 A</strong><br>3. FrS : <strong>50 Hz</strong>", attentes: { UnS: 380.0, nCr: 5.5, FrS: 50.0 } },
        tp2: { titre: "TP 2 : Rampes de Vitesse", consignes: "1. ACC : <strong>5.0 s</strong><br>2. dEC : <strong>2.5 s</strong>", attentes: { ACC: 5.0, dEC: 2.5 } },
        tp3: { titre: "TP 3 : Bornes de Vitesse", consignes: "1. LSP : <strong>15.0 Hz</strong><br>2. HSP : <strong>60.0 Hz</strong>", attentes: { LSP: 15.0, HSP: 60.0 } }
    };

    let cheminActuel = [menuATV320];
    let indexActuel = 0;
    let modeEdition = false;
    let enValidation = false;
    let defautActif = null;
    let timerInactivite = null;
    let dernierRapport = null;

    let di1 = false; di2 = false;
    let frequenceReelle = 0.0;
    let courantReel = 0.0;
    let angleRotor = 0;
    let sensRotation = 1;

    // Buffer Oscilloscope
    const canvas = document.getElementById("oscilloscope");
    const ctx = canvas.getContext("2d");
    const bufferTaille = 80;
    let histFrq = new Array(bufferTaille).fill(0);
    let histCourant = new Array(bufferTaille).fill(0);

    // Audio MLI / PWM
    let audioCtx = null;
    let oscMLI = null;
    let gainMLI = null;
    let audioAutorise = false;

    const ecran = document.getElementById("affichage");

    function obtenirValeurParam(key) {
        let res = null;
        function chercher(n) {
            if (n.paramKey === key) res = n.valeur;
            if (n.enfants) n.enfants.forEach(chercher);
        }
        chercher(menuATV320);
        return res;
    }

    // 2. Navigation Façade
    function mettreAjourEcran() {
        if (defautActif) { ecran.innerText = defautActif; ecran.style.color = "#ff0000"; return; }
        let noeudActuel = cheminActuel[cheminActuel.length - 1];
        if (cheminActuel.length === 1 && !modeEdition) {
            if (frequenceReelle > 0.1) { ecran.innerText = frequenceReelle.toFixed(1); ecran.style.color = "#00ffcc"; }
            else { ecran.innerText = "rdY"; ecran.style.color = "#ff0000"; }
            return;
        }
        if (modeEdition) {
            ecran.innerText = noeudActuel.enfants[indexActuel].valeur.toFixed(1);
            ecran.style.color = "#00ff00";
        } else {
            ecran.innerText = noeudActuel.enfants.length > 0 ? noeudActuel.enfants[indexActuel].id : "----";
            ecran.style.color = "#ff0000";
        }
    }

    function reinitialiserTimeout() {
        clearTimeout(timerInactivite);
        timerInactivite = setTimeout(() => {
            if (!defautActif) { cheminActuel = [menuATV320]; indexActuel = 0; modeEdition = false; mettreAjourEcran(); }
        }, 15000);
    }

    function actionHaut() {
        reinitialiserTimeout(); if (enValidation || defautActif) return;
        let noeudActuel = cheminActuel[cheminActuel.length - 1];
        if (modeEdition) { let p = noeudActuel.enfants[indexActuel]; p.valeur = parseFloat((p.valeur + p.pas).toFixed(1)); }
        else { if (indexActuel < noeudActuel.enfants.length - 1) indexActuel++; }
        mettreAjourEcran();
    }

    function actionBas() {
        reinitialiserTimeout(); if (enValidation || defautActif) return;
        let noeudActuel = cheminActuel[cheminActuel.length - 1];
        if (modeEdition) { let p = noeudActuel.enfants[indexActuel]; if (p.valeur - p.pas >= 0) p.valeur = parseFloat((p.valeur - p.pas).toFixed(1)); }
        else { if (indexActuel > 0) indexActuel--; }
        mettreAjourEcran();
    }

    function actionEnt() {
        reinitialiserTimeout(); if (enValidation || defautActif) return;
        let noeudActuel = cheminActuel[cheminActuel.length - 1];
        let selection = noeudActuel.enfants[indexActuel];
        if (modeEdition) {
            enValidation = true; ecran.classList.add("clignotement");
            setTimeout(() => { ecran.classList.remove("clignotement"); modeEdition = false; enValidation = false; mettreAjourEcran(); }, 1200);
        } else if (selection && selection.type === "menu") { cheminActuel.push(selection); indexActuel = 0; mettreAjourEcran(); }
        else if (selection && selection.type === "param") { modeEdition = true; mettreAjourEcran(); }
    }

    function actionEsc() {
        reinitialiserTimeout(); if (enValidation) return;
        if (modeEdition) modeEdition = false;
        else if (cheminActuel.length > 1) { cheminActuel.pop(); indexActuel = 0; }
        else { cheminActuel = [menuATV320]; indexActuel = 0; }
        mettreAjourEcran();
    }

    function basculerDI(num) {
        if (num === 1) { di1 = !di1; if (di1) di2 = false; }
        else if (num === 2) { di2 = !di2; if (di2) di1 = false; }
        document.getElementById("sw-di1").className = di1 ? "switch-btn active" : "switch-btn";
        document.getElementById("sw-di1").innerText = di1 ? "ON" : "OFF";
        document.getElementById("sw-di2").className = di2 ? "switch-btn active" : "switch-btn";
        document.getElementById("sw-di2").innerText = di2 ? "ON" : "OFF";
    }

    // 3. Module Web Audio API (Son MLI)
    function initialiserAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscMLI = audioCtx.createOscillator();
            gainMLI = audioCtx.createGain();

            oscMLI.type = 'sawtooth'; // Harmoniques proches du découpage MLI
            oscMLI.frequency.value = 100;
            gainMLI.gain.value = 0;

            oscMLI.connect(gainMLI);
            gainMLI.connect(audioCtx.destination);
            oscMLI.start();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function basculerAudio() {
        audioAutorise = !audioAutorise;
        const btn = document.getElementById("btn-audio");
        if (audioAutorise) {
            initialiserAudio();
            btn.className = "btn-audio actif";
            btn.innerText = "🔊 Son MLI Actif";
        } else {
            if (gainMLI) gainMLI.gain.value = 0;
            btn.className = "btn-audio";
            btn.innerText = "🔇 Activer Son MLI Moteur";
        }
    }

    // 4. Moteur Physique, Oscilloscope et Synthèse Sonore
    function boucleMoteur() {
        const acc = obtenirValeurParam("ACC") || 3.0;
        const dec = obtenirValeurParam("dEC") || 3.0;
        const hsp = obtenirValeurParam("HSP") || 50.0;
        const lsp = obtenirValeurParam("LSP") || 0.0;
        const ncr = obtenirValeurParam("nCr") || 4.2;

        let consigneFrq = 0.0;
        if (!defautActif) {
            if (di1) { consigneFrq = hsp; sensRotation = 1; }
            else if (di2) { consigneFrq = hsp; sensRotation = -1; }
        }

        const pasTemps = 0.05;
        let enAcceleration = false;

        if (frequenceReelle < consigneFrq) {
            frequenceReelle += ((hsp - lsp) / acc) * pasTemps;
            if (frequenceReelle > consigneFrq) frequenceReelle = consigneFrq;
            enAcceleration = true;
        } else if (frequenceReelle > consigneFrq) {
            frequenceReelle -= (hsp / dec) * pasTemps;
            if (frequenceReelle < 0) frequenceReelle = 0;
        }

        // Calcul dynamique du courant absorbé (Loi U/f + pic au démarrage)
        if (frequenceReelle > 0.1) {
            let chargeNominale = ncr * (frequenceReelle / 50.0);
            courantReel = enAcceleration ? chargeNominale * 1.6 : chargeNominale; // Pic d'intensité transitoire
        } else {
            courantReel = 0.0;
        }

        // Animation Rotor SVG
        if (frequenceReelle > 0.1) {
            angleRotor += (frequenceReelle / 5) * sensRotation;
            document.getElementById("rotor").setAttribute("transform", `rotate(${angleRotor} 50 50)`);
        }

        // Modulateur Audio MLI
        if (audioAutorise && gainMLI) {
            if (frequenceReelle > 0.1) {
                oscMLI.frequency.value = 120 + (frequenceReelle * 14); // Variation de tonalité PWM
                gainMLI.gain.value = 0.03 + (courantReel / 100);       // Volume proportionnel à la charge
            } else {
                gainMLI.gain.value = 0;
            }
        }

        // Mise à jour de l'Oscilloscope
        histFrq.push(frequenceReelle); histFrq.shift();
        histCourant.push(courantReel); histCourant.shift();
        dessinerOscilloscope();

        if (cheminActuel.length === 1 && !modeEdition && !defautActif) mettreAjourEcran();

        setTimeout(boucleMoteur, 50);
    }

    function dessinerOscilloscope() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Lignes de grille
        ctx.strokeStyle = "#222"; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2);
        ctx.stroke();

        // Tracé Fréquence (Cyan)
        ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i < histFrq.length; i++) {
            let x = (i / (histFrq.length - 1)) * canvas.width;
            let y = canvas.height - (histFrq[i] / 70) * canvas.height;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Tracé Courant (Jaune)
        ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 1.5; ctx.beginPath();
        for (let i = 0; i < histCourant.length; i++) {
            let x = (i / (histCourant.length - 1)) * canvas.width;
            let y = canvas.height - (histCourant[i] / 10) * canvas.height;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // 5. Gestion des TP et Exportation Word
    function changerTP() {
        const cle = document.getElementById("select-tp").value;
        const tp = banquesTP[cle];
        document.getElementById("consigne-tp").innerHTML = `<strong>${tp.titre}</strong><br>${tp.consignes}`;
        document.getElementById("resultat-tp").style.display = "none";
        document.getElementById("btn-export").style.display = "none";
    }

    function evaluerTP() {
        const nom = document.getElementById("nom-etudiant").value.trim();
        const prenom = document.getElementById("prenom-etudiant").value.trim();
        if (!nom || !prenom) { alert("Saisissez le nom et prénom."); return; }

        const cle = document.getElementById("select-tp").value;
        const tp = banquesTP[cle];
        let points = 0, total = Object.keys(tp.attentes).length, details = [];

        for (let param in tp.attentes) {
            let valAct = obtenirValeurParam(param);
            if (valAct === tp.attentes[param]) {
                points++; details.push({ param: param, attendu: tp.attentes[param], obtenu: valAct, statut: "OK" });
            } else {
                details.push({ param: param, attendu: tp.attentes[param], obtenu: valAct, statut: "ERREUR" });
            }
        }

        const note = Math.round((points / total) * 20);
        dernierRapport = {
            nom: nom, prenom: prenom, tpTitre: tp.titre, note: note, details: details,
            date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
        };

        const box = document.getElementById("resultat-tp");
        box.style.display = "block";
        box.style.background = note >= 10 ? "#1e4620" : "#5c1d24";
        box.innerHTML = `<strong>Note : ${note} / 20</strong><br>` + 
            details.map(d => d.statut === "OK" ? `✅ <strong>${d.param}</strong> : ${d.obtenu}` : `❌ <strong>${d.param}</strong> : ${d.obtenu} (Attendu: ${d.attendu})`).join("<br>");

        document.getElementById("btn-export").style.display = "inline-block";
    }

    function exporterRapportWord() {
        if (!dernierRapport) return;
        const contenuHtml = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>Rapport d'Évaluation</title>
            <style>body { font-family: Arial, sans-serif; padding: 20px; } table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid #ddd; padding: 8px; } th { background-color: #f2f2f2; }</style>
            </head>
            <body>
                <h2>Compte-Rendu d'Évaluation - ATV320</h2>
                <p><strong>Étudiant :</strong> ${dernierRapport.nom} ${dernierRapport.prenom}</p>
                <p><strong>Date :</strong> ${dernierRapport.date}</p>
                <p><strong>Épreuve :</strong> ${dernierRapport.tpTitre}</p>
                <hr><h3>Note : ${dernierRapport.note} / 20</h3>
                <table>
                    <thead><tr><th>Paramètre</th><th>Attendu</th><th>Obtenu</th><th>Statut</th></tr></thead>
                    <tbody>
                        ${dernierRapport.details.map(d => `<tr><td><b>${d.param}</b></td><td>${d.attendu}</td><td>${d.obtenu}</td><td>${d.statut}</td></tr>`).join('')}
                    </tbody>
                </table>
            </body></html>`;
        const blob = new Blob(['\ufeff' + contenuHtml], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url;
        a.download = `Rapport_${dernierRapport.nom}_${dernierRapport.prenom}.doc`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function declencherDefaut(code) { defautActif = code; ecran.classList.add("clignotement"); di1 = false; di2 = false; basculerDI(0); mettreAjourEcran(); }
    function acquitterDefaut() { ecran.classList.remove("clignotement"); defautActif = null; mettreAjourEcran(); reinitialiserTimeout(); }

    function configurerAppuiLong(elementId, action) {
        const btn = document.getElementById(elementId);
        let timerInitial, intervalRapide;
        const demarrer = (e) => {
            if (e.cancelable) e.preventDefault();
            action();
            timerInitial = setTimeout(() => { intervalRapide = setInterval(action, 100); }, 400);
        };
        const arreter = () => { clearTimeout(timerInitial); clearInterval(intervalRapide); };
        btn.addEventListener('touchstart', demarrer, { passive: false });
        btn.addEventListener('touchend', arreter);
        btn.addEventListener('touchcancel', arreter);
        btn.addEventListener('mousedown', demarrer);
        btn.addEventListener('mouseup', arreter);
        btn.addEventListener('mouseleave', arreter);
    }

    document.addEventListener('DOMContentLoaded', () => {
        configurerAppuiLong('btn-haut', actionHaut);
        configurerAppuiLong('btn-bas', actionBas);
        changerTP();
        reinitialiserTimeout();
        boucleMoteur();
    });
</script>
