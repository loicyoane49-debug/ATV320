<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulateur ATV320</title>
    <style>
        /* Style responsive PC & Mobile */
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none; /* Empêche la sélection de texte au maintien */
        }
        .facade-variateur {
            background-color: #2b2b2b;
            border: 4px solid #444;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .ecran-led {
            background-color: #111;
            color: #ff2a2a;
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #333;
            margin-bottom: 25px;
            letter-spacing: 2px;
            min-height: 40px;
        }
        .clignotement {
            animation: blink 0.25s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .pave-boutons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-atv {
            background-color: #3a3a3a;
            color: #fff;
            border: 2px solid #555;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-atv:active {
            background-color: #555;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

<div class="facade-variateur">
    <div id="affichage_led" class="ecran-led">rEF-</div>
    
    <div class="pave-boutons">
        <button id="btn_esc" class="btn-atv">ESC</button>
        <button id="btn_ent" class="btn-atv">ENT</button>
        <button id="btn_haut" class="btn-atv">▲</button>
        <button id="btn_bas" class="btn-atv">▼</button>
    </div>
</div>

<script>
    const ecran = document.getElementById('affichage_led');
    let valeurFrequence = 50.0;
    let modeEdition = false;

    // 1. Gestion du clignotement à la validation (ENT)
    function validerSaisie(callback) {
        ecran.classList.add('clignotement');
        setTimeout(() => {
            ecran.classList.remove('clignotement');
            if (callback) callback();
        }, 1200);
    }

    document.getElementById('btn_ent').addEventListener('click', () => {
        validerSaisie(() => {
            modeEdition = !modeEdition;
            ecran.innerText = modeEdition ? valeurFrequence.toFixed(1) : "rEF-";
        });
    });

    // 2. Gestion hybride (PC/Mobile) pour l'appui long
    function attacherAppuiLong(element, action) {
        let timerInitial, intervalRapide;

        const demarrer = (e) => {
            if (e.cancelable) e.preventDefault();
            action();
            timerInitial = setTimeout(() => {
                intervalRapide = setInterval(action, 100);
            }, 400);
        };

        const arreter = () => {
            clearTimeout(timerInitial);
            clearInterval(intervalRapide);
        };

        // Événements Tactiles
        element.addEventListener('touchstart', demarrer, { passive: false });
        element.addEventListener('touchend', arreter);
        element.addEventListener('touchcancel', arreter);

        // Événements Souris PC
        element.addEventListener('mousedown', demarrer);
        element.addEventListener('mouseup', arreter);
        element.addEventListener('mouseleave', arreter);
    }

    // Incrémentation / Décrémentation
    attacherAppuiLong(document.getElementById('btn_haut'), () => {
        if (valeurFrequence < 500.0) {
            valeurFrequence = parseFloat((valeurFrequence + 0.1).toFixed(1));
            ecran.innerText = valeurFrequence.toFixed(1);
        }
    });

    attacherAppuiLong(document.getElementById('btn_bas'), () => {
        if (valeurFrequence > 0.0) {
            valeurFrequence = parseFloat((valeurFrequence - 0.1).toFixed(1));
            ecran.innerText = valeurFrequence.toFixed(1);
        }
    });
</script>

</body>
</html>
