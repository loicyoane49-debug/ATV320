<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulateur ATV320 - Complet</title>
    <style>
        body {
            background-color: #e9ecef;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .variateur {
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 300px;
        }
        .ecran {
            background-color: #3b0000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-align: right;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
        .clignotement {
            animation: clignoterLed 0.25s infinite alternate;
        }
        @keyframes clignoterLed {
            from { opacity: 1; }
            to { opacity: 0.1; }
        }
        .controles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            background-color: #4a4a4a;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #1a1a1a;
            touch-action: manipulation;
        }
        button:active {
            box-shadow: 0 0px #1a1a1a;
            transform: translateY(4px);
        }
        .btn-esc { background-color: #8b0000; }
        .btn-ent { background-color: #006400; }
        .molette {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
        }
        .molette button { width: 45%; }

        /* Panneau Formateur : Injection de défauts */
        .panneau-defauts {
            margin-top: 25px;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
            box-sizing: border-box;
        }
        .panneau-defauts h4 { margin: 0 0 10px 0; color: #333; }
        .btn-defaut {
            background-color: #d9534f;
            font-size: 13px;
            padding: 8px;
            margin: 3px;
            box-shadow: none;
        }
        .btn-reset {
            background-color: #0275d8;
            font-size: 13px;
            padding: 8px;
            margin-top: 8px;
            width: 100%;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="variateur">
        <div class="ecran" id="affichage">rdY</div>
        
        <div class="controles">
            <button class="btn-esc" onclick="actionEsc()">ESC</button>
            <button class="btn-ent" onclick="actionEnt()">ENT</button>
            <div class="molette">
                <button id="btn-haut">▲</button>
                <button id="btn-bas">▼</button>
            </div>
        </div>
    </div>

    <!-- Outil Formateur pour déclencher des pannes -->
    <div class="panneau-defauts">
        <h4>Simulateur de Pannes</h4>
        <button class="btn-defaut" onclick="declencherDefaut('OHF')">OHF (Surchauffe)</button>
        <button class="btn-defaut" onclick="declencherDefaut('OLF')">OLF (Surcharge)</button>
        <button class="btn-defaut" onclick="declencherDefaut('OSF')">OSF (Surtension)</button>
        <button class="btn-reset" onclick="acquitterDefaut()">Acquitter / Reset</button>
    </div>

    <script>
        // 1. Arborescence enrichie (Rampes + Plaque Moteur drC-)
        const menuATV320 = {
            id: "ROOT", type: "menu", enfants: [
                { id: "rEF-", type: "menu", enfants: [] },
                { id: "COnF", type: "menu", enfants: [
                    { id: "FULL", type: "menu", enfants: [
                        { id: "drC-", type: "menu", enfants: [
                            { id: "bFr", type: "param", valeur: 50.0, pas: 10.0 }, // Fréquence base (Hz)
                            { id: "UnS", type: "param", valeur: 400.0, pas: 10.0 }, // Tension nominale (V)
                            { id: "nCr", type: "param", valeur: 4.2, pas: 0.1 },   // Courant nominal (A)
                            { id: "FrS", type: "param", valeur: 50.0, pas: 1.0 }   // Fréquence nominale
                        ]},
                        { id: "FUn-", type: "menu", enfants: [
                            { id: "ACC", type: "param", valeur: 3.0, pas: 0.1 },   // Accélération (s)
                            { id: "dEC", type: "param", valeur: 3.0, pas: 0.1 },   // Décélération (s)
                            { id: "LSP", type: "param", valeur: 0.0, pas: 0.1 },   // Petite vitesse (Hz)
                            { id: "HSP", type: "param", valeur: 50.0, pas: 0.1 }   // Grande vitesse (Hz)
                        ]}
                    ]}
                ]}
            ]
        };

        // 2. Variables d'état
        let cheminActuel = [menuATV320];
        let indexActuel = 0;
        let modeEdition = false;
        let enValidation = false;
        let defautActif = null; // Stocke le code d'erreur si présent
        let timerInactivite = null;

        const ecran = document.getElementById("affichage");

        // 3. Gestion de l'affichage
        function mettreAjourEcran() {
            if (defautActif) {
                ecran.innerText = defautActif;
                ecran.style.color = "#ff0000";
                return;
            }

            let noeudActuel = cheminActuel[cheminActuel.length - 1];
            
            if (cheminActuel.length === 1 && !modeEdition) {
                ecran.innerText = "rdY";
                ecran.style.color = "#ff0000";
                return;
            }

            if (modeEdition) {
                ecran.innerText = noeudActuel.enfants[indexActuel].valeur.toFixed(1);
                ecran.style.color = "#00ff00";
            } else {
                if (noeudActuel.enfants.length > 0) {
                    ecran.innerText = noeudActuel.enfants[indexActuel].id;
                } else {
                    ecran.innerText = "----";
                }
                ecran.style.color = "#ff0000";
            }
        }

        // 4. Timer d'inactivité (Retour à rdY après 15s)
        function reinitialiserTimeout() {
            clearTimeout(timerInactivite);
            timerInactivite = setTimeout(() => {
                if (!defautActif) {
                    cheminActuel = [menuATV320];
                    indexActuel = 0;
                    modeEdition = false;
                    mettreAjourEcran();
                }
            }, 15000);
        }

        // 5. Actions des boutons
        function actionHaut() {
            reinitialiserTimeout();
            if (enValidation || defautActif) return;

            let noeudActuel = cheminActuel[cheminActuel.length - 1];
            if (modeEdition) {
                let param = noeudActuel.enfants[indexActuel];
                param.valeur = parseFloat((param.valeur + param.pas).toFixed(1));
            } else {
                if (indexActuel < noeudActuel.enfants.length - 1) indexActuel++;
            }
            mettreAjourEcran();
        }

        function actionBas() {
            reinitialiserTimeout();
            if (enValidation || defautActif) return;

            let noeudActuel = cheminActuel[cheminActuel.length - 1];
            if (modeEdition) {
                let param = noeudActuel.enfants[indexActuel];
                if (param.valeur - param.pas >= 0) {
                    param.valeur = parseFloat((param.valeur - param.pas).toFixed(1));
                }
            } else {
                if (indexActuel > 0) indexActuel--;
            }
            mettreAjourEcran();
        }

        function actionEnt() {
            reinitialiserTimeout();
            if (enValidation || defautActif) return;

            let noeudActuel = cheminActuel[cheminActuel.length - 1];
            let selection = noeudActuel.enfants[indexActuel];

            if (modeEdition) {
                enValidation = true;
                ecran.classList.add("clignotement");

                setTimeout(() => {
                    ecran.classList.remove("clignotement");
                    modeEdition = false;
                    enValidation = false;
                    mettreAjourEcran();
                }, 1200);

            } else if (selection && selection.type === "menu") {
                cheminActuel.push(selection);
                indexActuel = 0;
                mettreAjourEcran();
            } else if (selection && selection.type === "param") {
                modeEdition = true;
                mettreAjourEcran();
            }
        }

        function actionEsc() {
            reinitialiserTimeout();
            if (enValidation) return;

            if (modeEdition) {
                modeEdition = false;
            } else if (cheminActuel.length > 1) {
                cheminActuel.pop();
                indexActuel = 0;
            } else {
                cheminActuel = [menuATV320];
                indexActuel = 0;
            }
            mettreAjourEcran();
        }

        // 6. Gestion du Panneau de Défauts
        function declencherDefaut(codeDefaut) {
            defautActif = codeDefaut;
            ecran.classList.add("clignotement");
            mettreAjourEcran();
        }

        function acquitterDefaut() {
            ecran.classList.remove("clignotement");
            defautActif = null;
            mettreAjourEcran();
            reinitialiserTimeout();
        }

        // 7. Appui long (Défilement rapide)
        function configurerAppuiLong(elementId, action) {
            const btn = document.getElementById(elementId);
            let timerInitial, intervalRapide;

            const demarrer = (e) => {
                if (e.cancelable) e.preventDefault();
                action();
                timerInitial = setTimeout(() => {
                    intervalRapide = setInterval(action, 100);
                }, 400);
            };

            const arreter = () => {
                clearTimeout(timerInitial);
                clearInterval(intervalRapide);
            };

            btn.addEventListener('touchstart', demarrer, { passive: false });
            btn.addEventListener('touchend', arreter);
            btn.addEventListener('touchcancel', arreter);
            btn.addEventListener('mousedown', demarrer);
            btn.addEventListener('mouseup', arreter);
            btn.addEventListener('mouseleave', arreter);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            configurerAppuiLong('btn-haut', actionHaut);
            configurerAppuiLong('btn-bas', actionBas);
            reinitialiserTimeout();
        });
    </script>
</body>
</html>
